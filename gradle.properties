# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment parameter names
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# NeoForge
# https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.268
loader_version_range=[4,)

# Kotlin
# KFF 5.13.0 内置 Kotlin 2.4.21 —— 编译用的 kotlin 插件版本必须与之一致，
# 否则编译器与本语言提供者共享的 stdlib 不匹配。
kotlin_version=2.4.21
kff_version=5.13.0
kotlinforforge_version_range=[${kff_version},6.0.0)

## Mod Properties

mod_id=taikocraft
mod_name=TaikoCraft
mod_license=MIT
mod_version=0.1.0
mod_group_id=top.drawtwice.taikocraft
mod_authors=坠尔 (ShineDer)
mod_description=在 Minecraft 里开一家太鼓机厅。Phase 1：TJA/OSZ 谱面、PC 键盘判定、延迟校准。VR/外设/联机在后续阶段。
